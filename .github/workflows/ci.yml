name: CI

# Code-quality gate for NEW CODE (distinct from refresh-data.yml, which validates
# the daily DATA). Runs typecheck + unit tests on every code change. No API key.
# Data-only commits (the daily refresh touches static/data) skip this.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/data/**'
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test
